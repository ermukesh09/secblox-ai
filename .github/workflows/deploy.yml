name: Build and deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notify Bing / ChatGPT search via IndexNow
        run: |
          sleep 45
          python3 - <<'PY'
          import json, re, urllib.request
          src = open("build.py").read()
          key = re.search(r'"indexnow_key": "([0-9a-f]+)"', src).group(1)
          domain = re.search(r'"domain": "(https://[^"]+)"', src).group(1)
          host = domain.replace("https://", "")
          sitemap = urllib.request.urlopen(domain + "/sitemap.xml", timeout=30).read().decode()
          urls = re.findall(r"<loc>(.*?)</loc>", sitemap)
          body = json.dumps({"host": host, "key": key, "keyLocation": f"{domain}/{key}.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          try:
              r = urllib.request.urlopen(req, timeout=30)
              print("IndexNow response:", r.status, "for", len(urls), "URLs")
          except urllib.error.HTTPError as e:
              print("IndexNow returned", e.code, e.read().decode()[:300])
          PY
